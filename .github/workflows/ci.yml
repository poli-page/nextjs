name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Allow codecov-action's tokenless (OIDC) upload on public repo.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        next: [14, 15]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example-app/package-lock.json
      - run: npm ci
      - run: npm install --no-save next@^${{ matrix.next }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run lint:pack
      # The contract tests run the example app, built against this build of the package.
      - name: Install the example app
        run: npm ci
        working-directory: example-app
      - name: Build the example app
        run: npm run build
        working-directory: example-app
      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Test (with coverage)
        run: npm run test:coverage
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
      - name: Upload coverage to Codecov
        if: matrix.node == 22 && matrix.next == 15
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          # OIDC auth — no CODECOV_TOKEN secret needed; requires id-token: write
          # (set at the workflow level) and the repo to be enrolled at codecov.io.
          use_oidc: true
          fail_ci_if_error: false
