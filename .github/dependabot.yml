version: 2
updates:
  # One npm entry for both packages. The root library and example-app both
  # depend on @poli-page/sdk; bumping it in only one of them installs two SDK
  # copies and breaks the example-app build (nominal PoliPage type mismatch).
  # group-by: dependency-name makes each bump one PR across both directories.
  - package-ecosystem: npm
    directories:
      - /
      - /example-app
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # TypeScript 7: @typescript-eslint 8 peers typescript <6.1. Lift once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-across-directories:
        patterns:
          - '*'
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily: a new API contract version (poli-page/api-contract) arrives as a PR at once.
      interval: daily
    labels:
      - dependencies
      - ci
    # Dependabot waits 3 days after a release by default. The API contract is
    # exempt so its PR arrives the next day; other actions keep the wait.
    cooldown:
      default-days: 3
      exclude:
        - 'poli-page/api-contract'
    groups:
      # The API contract gets PRs of its own: a contract bump shows what the
      # API change breaks, never mixed with other action bumps.
      api-contract:
        patterns:
          - 'poli-page/api-contract'
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'poli-page/api-contract'
